spring.application.name=cicloapi

# dev local: le o .env da raiz do projeto (mesmo arquivo que o compose usa).
# Em container o arquivo nao existe e os valores vem das variaveis de ambiente.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/db_clientes
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# schema e criado/evoluido pelo Flyway (db/migration) - hibernate so valida o mapeamento
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# banco que ja existia antes do Flyway (criado pelo schema.sql antigo) e
# marcado como V1 em vez de rodar a migration de novo
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.docker.compose.enabled=false

# sem fallback de proposito: a aplicacao nao sobe sem estes valores.
# JWT_SECRET: gere com `openssl rand -hex 32`
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# admin unico, criado automaticamente no primeiro start se app_user estiver vazia
app.security.admin.username=${ADMIN_USERNAME}
app.security.admin.password=${ADMIN_PASSWORD}

# origens liberadas no CORS, separadas por virgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# so /actuator/health fica exposto, sem detalhes
management.endpoints.web.exposure.include=health
